apiVersion: 1

groups:
  - orgId: 1
    name: raspberry-pi
    folder: Raspberry Pi
    interval: 1m
    rules:
      - uid: rpi-cpu-temperature
        title: CPU temperature high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: The SoC has been above 70 C for five minutes. Check the cooler and the airflow.
        labels:
          severity: warning
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: node_hwmon_temp_celsius{chip="thermal_thermal_zone0",sensor="temp0"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [70]

      - uid: rpi-disk-space
        title: Root filesystem filling up
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Less than 15 percent free on the root filesystem. Lower the Prometheus retention or move the data to an SSD.
        labels:
          severity: warning
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 100 * node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [15]

      - uid: rpi-target-down
        title: Monitored device offline
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: Prometheus has not been able to reach this target for two minutes.
        labels:
          severity: critical
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: up
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: rpi-under-voltage
        title: Under-voltage detected
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: The Raspberry Pi reports under-voltage. Use the official power supply and check the cable.
        labels:
          severity: critical
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: rpi_throttled_state{state="under_voltage"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
