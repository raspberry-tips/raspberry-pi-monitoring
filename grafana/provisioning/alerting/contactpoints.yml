apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-raspberry-pi
        type: webhook
        settings:
          url: https://ntfy.sh
          httpMethod: POST
          payload:
            template: |
              {"topic":"your-topic-name-here","title":"{{ if eq .Status "firing" }}{{ .CommonLabels.alertname }}{{ else }}Resolved: {{ .CommonLabels.alertname }}{{ end }}","message":"{{ range .Alerts }}{{ .Annotations.summary }} [{{ .Labels.instance }}] {{ end }}","tags":["{{ if eq .Status "firing" }}rotating_light{{ else }}white_check_mark{{ end }}"],"priority":{{ if eq .Status "firing" }}4{{ else }}3{{ end }}}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: ntfy
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
